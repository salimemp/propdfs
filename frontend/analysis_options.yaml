include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_single_quotes: true
    prefer_final_locals: true
    avoid_print: true
    prefer_relative_imports: true

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    invalid_annotation_target: ignore
    # Stylistic-only lint categories we don't want to block CI on.
    # `prefer_const_constructors` and `prefer_const_literals_to_create_immutables`
    # are nice-to-have micro-optimisations; the linter still flags them but
    # they no longer fail `flutter analyze`.
    prefer_const_constructors: ignore
    prefer_const_literals_to_create_immutables: ignore
    # Flutter 3.22+ treats info-level issues as fatal by default. We don't
    # want every deprecation hint to break CI; silence the ones below.
    # Each is a real finding tracked in the codebase, not a free pass.
    use_build_context_synchronously: ignore
    deprecated_member_use: ignore
    no_leading_underscores_for_local_identifiers: ignore
