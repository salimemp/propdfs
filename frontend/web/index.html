<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Base href is set at build time via --base-href. Default "/" is
    correct for Cloudflare Pages at propdfs.com.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ===== SEO basics ===== -->
  <title>ProPDFs — Every PDF tool. Private. Free.</title>
  <meta name="description" content="32 PDF tools in one place — merge, split, compress, convert, edit, sign, OCR, and translate. Runs in your browser, end-to-end encrypted, GDPR-ready, WCAG 2.1 AA. No account needed for the basics.">
  <meta name="keywords" content="PDF tools, merge PDF, split PDF, compress PDF, PDF to Word, Word to PDF, OCR PDF, edit PDF, sign PDF, free PDF editor, online PDF tools, iLovePDF alternative, SmallPDF alternative">
  <meta name="author" content="ProPDFs">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
  <meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1">

  <!-- Google Search Console verification. Two methods deployed for
       belt-and-suspenders reliability:
         1) This <meta> tag (the recommended method for SPAs —
            Google reads the head from any page that hits the
            canonical URL).
         2) The HTML file at /googleBguSVNY65bi-pvRVGT8KqpBUnwMutY6BWAqkUBrKTR0.html
            with the matching `google-site-verification:` body
            (fallback in case a crawler hits that path first).
       Token belongs to the propdfs.com property in Google Search
       Console. Rotate the token if the property is ever moved. -->
  <meta name="google-site-verification" content="BguSVNY65bi-pvRVGT8KqpBUnwMutY6BWAqkUBrKTR0">
  <link rel="canonical" href="https://propdfs.com/">

  <!-- Language alternates. We translate the UI into 25+ locales; every
       locale should have its own URL so search engines can serve the
       right one to the right user. -->
  <link rel="alternate" hreflang="en" href="https://propdfs.com/">
  <link rel="alternate" hreflang="x-default" href="https://propdfs.com/">
  <!-- Per-locale alternates are listed in the sitemap.xml -->

  <!-- Feed autodiscovery. RSS readers (Feedly, NetNewsWire, Inoreader,
       browser extensions) look for these <link rel="alternate"> tags
       in the page head to subscribe the user without them having to
       paste a URL. Ship RSS 2.0 and Atom 1.0 — every major reader
       accepts at least one. /feed.xml is a mirror of rss.xml for
       readers that only check that path. -->
  <link rel="alternate" type="application/rss+xml"
        title="ProPDFs Blog (RSS 2.0)"
        href="https://propdfs.com/rss.xml">
  <link rel="alternate" type="application/atom+xml"
        title="ProPDFs Blog (Atom 1.0)"
        href="https://propdfs.com/atom.xml">

  <!-- ===== Open Graph ===== -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ProPDFs">
  <meta property="og:title" content="ProPDFs — Every PDF tool. Private. Free.">
  <meta property="og:description" content="32 PDF tools in one place — merge, split, compress, convert, edit, sign, OCR, and translate. End-to-end encrypted.">
  <meta property="og:url" content="https://propdfs.com/">
  <meta property="og:image" content="https://propdfs.com/og-default.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="ProPDFs — 32 PDF tools, in-browser, zero upload">
  <meta property="og:locale" content="en_US">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ProPDFs — Every PDF tool. Private. Free.">
  <meta name="twitter:description" content="32 PDF tools in one place. In-browser, end-to-end encrypted, GDPR-ready.">
  <meta name="twitter:image" content="https://propdfs.com/og-default.png">

  <!-- ===== Structured data ===== -->
  <!-- SoftwareApplication — what Google shows in the rich result for our
       home page. Mirrors what app.getpdfpro.com already uses so the two
       brands stay consistent. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "ProPDFs",
    "alternateName": "GetPDFPro",
    "url": "https://propdfs.com",
    "description": "32 PDF tools in one place. End-to-end encrypted, GDPR-ready, WCAG 2.1 AA.",
    "applicationCategory": "MultimediaApplication",
    "applicationSubCategory": "PDF Editor",
    "operatingSystem": "Web, iOS, Android, macOS, Windows, Linux",
    "offers": [
      {
        "@type": "Offer",
        "name": "Free",
        "price": "0",
        "priceCurrency": "USD",
        "category": "free",
        "description": "Unlimited use of basic PDF tools. No account required."
      }
    ],
    "featureList": [
      "Merge PDF",
      "Split PDF",
      "Compress PDF",
      "Convert PDF to Word",
      "Convert Word to PDF",
      "OCR scanned PDFs",
      "Edit PDF text and shapes",
      "Sign PDF",
      "End-to-end encryption",
      "GDPR compliant",
      "WCAG 2.1 AA",
      "25+ languages"
    ],
    "aggregateRating": {
      "@type": "AggregateRating",
      "ratingValue": "4.8",
      "ratingCount": "1240"
    }
  }
  </script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "ProPDFs",
    "url": "https://propdfs.com",
    "logo": "https://propdfs.com/icon.png",
    "description": "Free, fast, private PDF tools. End-to-end encrypted.",
    "sameAs": [],
    "contactPoint": {
      "@type": "ContactPoint",
      "contactType": "customer support",
      "email": "support@propdfs.com",
      "availableLanguage": ["English", "Hindi", "Spanish", "French", "German"]
    }
  }
  </script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "ProPDFs",
    "url": "https://propdfs.com",
    "inLanguage": "en_US",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://propdfs.com/tools?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- ===== PWA / iOS ===== -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ProPDFs">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#4F46E5">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F172A">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon set — multi-size so Chrome / Safari / Firefox all pick the
       best match. Generated via scripts/generate_favicons.py. -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Preconnect to the API so the first authenticated request after
       page load doesn't pay the DNS / TCP / TLS handshake cost. -->
  <link rel="preconnect" href="https://api.propdfs.com" crossorigin="anonymous">

  <!-- ProPDFs web shim. Defines window.propdfs.download(bytes, filename)
       for triggering browser downloads from the Dart side, and
       window.propdfs.ocr(imageDataUrl, lang) for running Tesseract.js
       text recognition. Loaded BEFORE flutter_bootstrap.js so the
       Dart side can call into it without race conditions. -->
  <script src="propdfs_shim.js"></script>

  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Skip-to-content link. Hidden by default, visible on focus so
    keyboard users can jump past the navigation.
  -->
  <a href="#main" class="skip-link">Skip to main content</a>

  <!--
    Loading screen shown while Flutter boots. Keeps SEO crawlers from
    seeing an empty <body>, and gives the user a quick visual cue.
  -->
  <style>
    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: #4F46E5;
      color: white;
      padding: 8px 16px;
      z-index: 9999;
      text-decoration: none;
      border-radius: 0 0 8px 0;
    }
    .skip-link:focus { top: 0; }
    .app-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      color: #0F172A;
    }
    .app-loading .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #E2E8F0;
      border-top-color: #4F46E5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <noscript>
    <div style="padding: 48px; max-width: 600px; margin: 80px auto;
                font-family: -apple-system, BlinkMacSystemFont, sans-serif;
                color: #0F172A; line-height: 1.6;">
      <h1 style="font-size: 28px; margin-bottom: 16px;">
        ProPDFs — 32 PDF tools. Private. Free.
      </h1>
      <p>ProPDFs runs in your browser. To use it, please enable
        JavaScript or open this page in a modern browser.</p>
      <p>Already running a PDF task? Your file never left your
        device.</p>
    </div>
  </noscript>

  <div class="app-loading" id="loading">
    <div class="spinner" aria-label="Loading ProPDFs"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Hide the loading spinner once Flutter has rendered. We can't
    // hook a Flutter callback here cleanly, so we poll for the
    // <flt-glass-pane> element that Flutter inserts on first paint.
    (function() {
      function hide() {
        var el = document.getElementById('loading');
        if (el) el.style.display = 'none';
      }
      var observer = new MutationObserver(function() {
        if (document.querySelector('flt-glass-pane, flutter-view')) {
          hide();
          observer.disconnect();
        }
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });
      // Hard fallback — hide after 8s no matter what so we never
      // strand the user on the spinner.
      setTimeout(hide, 8000);
    })();
  </script>
</body>
</html>
