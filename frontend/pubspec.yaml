name: propdfs
version: 1.0.0+1
publish_to: none

description: ProPDFs - Enterprise Document Processing Platform

environment:
  sdk: ^3.5.0
  flutter: ^3.24.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Navigation
  go_router: ^14.1.0
  
  # UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  
  # HTTP & Networking
  dio: ^5.4.0
  retrofit: ^4.1.0
  
  # Storage & Caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.0
  flutter_cache_manager: ^3.3.1
  
  # File Handling
  file_picker: ^8.0.0
  open_filex: ^4.4.0
  path_provider: ^2.1.0
  
  # PDF
  pdfx: ^2.6.0
  syncfusion_flutter_pdfviewer: ^26.1.0
  
  # Camera & Scanning
  camera: ^0.11.0
  image_picker: ^1.1.0
  google_mlkit_text_recognition: ^0.13.0
  
  # Voice & Accessibility
  speech_to_text: ^6.6.0
  flutter_tts: ^4.0.0
  
  # Localization
  flutter_localizations:
    sdk: flutter
  
  # Content & SEO
  flutter_markdown: ^0.7.0
  
  # Auth
  firebase_auth: ^4.19.0
  google_sign_in: ^6.2.0
  github_sign_in: ^0.0.6
  sign_in_with_apple: ^6.1.0
  local_auth: ^2.2.0
  
  # Payments
  flutter_stripe: ^10.1.0
  
  # Utils
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  intl: ^0.19.0
  uuid: ^4.4.0
  mime: ^1.0.0
  url_launcher: ^6.2.0
  share_plus: ^9.0.0
  package_info_plus: ^8.0.0
  
  # Analytics
  firebase_analytics: ^10.10.0
  firebase_crashlytics: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  retrofit_generator: ^8.1.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.0
  riverpod_lint: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# Platform specific
flutter_intl:
  enabled: true
