name: propdfs
version: 1.0.0+1
publish_to: none

description: ProPDFs - Enterprise Document Processing Platform

environment:
  sdk: ^3.5.0
  flutter: ^3.24.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Navigation
  go_router: ^14.1.0
  
  # UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  
  # HTTP & Networking
  dio: ^5.4.0
  retrofit: ^4.1.0
  
  # Storage & Caching
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.0
  flutter_cache_manager: ^3.3.1
  
  # File Handling
  file_picker: ^8.0.0
  open_filex: ^4.4.0
  path_provider: ^2.1.0
  
  # PDF
  pdfx: ^2.6.0
  
  # Camera & Scanning
  camera: ^0.11.0
  image_picker: ^1.1.0
  google_mlkit_text_recognition: ^0.13.0
  
  # Voice & Accessibility
  speech_to_text: ^6.6.0
  flutter_tts: ^4.0.0
  
  # Localization
  flutter_localizations:
    sdk: flutter
  
  # Content & SEO
  flutter_markdown: ^0.7.0
  
  # Auth
  google_sign_in: ^6.2.0
  sign_in_with_apple: ^6.1.0
  local_auth: ^2.2.0
  
  # Payments
  flutter_stripe: ^10.1.0

  # Observability — captures unhandled exceptions, Dio HTTP errors, and
  # route transitions as breadcrumbs. DSN is supplied at build time via
  # `--dart-define=SENTRY_DSN=...` (leave empty in dev to disable).
  sentry_flutter: ^7.14.0
  sentry_dio: ^7.14.0

  # Utils
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  # Pinned to ^0.20.2 because flutter_localizations from the current Flutter
  # SDK (3.44 here) requires intl >=0.20.2. The 0.19.0 pin only worked for
  # Flutter 3.24; bump with care and rerun `flutter analyze`.
  intl: ^0.20.2
  uuid: ^4.4.0
  mime: ^1.0.0
  url_launcher: ^6.2.0
  share_plus: ^12.0.2
  package_info_plus: ^8.0.0

  # PDF editing, repair, eSign, comment overlays. Syncfusion's community
  # license is free for individuals and small businesses; commercial use
  # needs a paid key (https://www.syncfusion.com/sales/communitylicense).
  # If you don't want Syncfusion, swap with `pdf` + `pdf_manipulator`
  # — but you'll lose the open-existing-pdf capability Repair needs.
  syncfusion_flutter_pdf: ^28.2.7
  syncfusion_flutter_pdfviewer: ^28.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # NOTE: build_runner / freezed / json_serializable / retrofit_generator /
  # riverpod_generator were previously declared here but no `.g.dart` files
  # have ever been generated — see commit history. Stripped to keep the build
  # surface lean. If you need codegen in the future, re-add them and run
  # `dart run build_runner build`.

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

# Platform specific
flutter_intl:
  enabled: true
