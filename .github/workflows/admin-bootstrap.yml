name: Bootstrap admin + mint PROPDFS_ADMIN_TOKEN

# Manual workflow the project owner runs ONCE to:
#   1. Register an admin user against the live API
#   2. Promote them to admin via direct DB UPDATE
#   3. Log in to get a refresh token
#   4. Print the refresh token to the run log so the owner can copy
#      it into the `PROPDFS_ADMIN_TOKEN` GitHub secret.
#
# Required secrets (already configured by the operator):
#   - PROPDFS_API          — backend base URL
#   - DATABASE_URL         — Postgres connection string
#   - HARBORSEO_API_KEY    — harborseo.ai key (used by the publish
#                            workflow this token unlocks)
#
# Workflow inputs (one-time, not stored):
#   - admin_email          — email to register
#   - admin_password       — strong password for the new admin
#   - admin_full_name      — display name, default "ProPDFs Admin"
#
# After this run, the operator rotates the `PROPDFS_ADMIN_TOKEN`
# secret to the printed value and never re-runs this workflow unless
# they need a fresh admin.

on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: "Email of the admin user to register/promote"
        required: true
        type: string
      admin_password:
        description: "Strong password (≥ 8 chars)"
        required: true
        type: string
      admin_full_name:
        description: "Display name"
        required: false
        default: "ProPDFs Admin"
        type: string

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: "Pre-flight: DNS + endpoint reachability"
        env:
          PROPDFS_API: ${{ secrets.PROPDFS_API }}
        # Fail fast with a human-readable message instead of a stack
        # trace. Three checks:
        #   1. PROPDFS_API is set and ends in /api/v1
        #   2. The hostname resolves
        #   3. PRODFSP_API/health returns 2xx
        run: |
          set -euo pipefail

          if [ -z "${PROPDFS_API:-}" ]; then
            echo "::error::PROPDFS_API secret is not set in this repo."
            echo "  Go to Settings → Secrets and variables → Actions and add it."
            exit 1
          fi

          # Strip trailing slash so we can safely append paths.
          BASE="${PROPDFS_API%/}"
          if [[ "$BASE" != */api/v1 ]]; then
            echo "::error::PROPDFS_API must end in /api/v1"
            echo "  Current value: $PROPDFS_API"
            echo "  Fix: edit the secret and append /api/v1 to the URL."
            echo "  Example: https://propdfs-backend-production.up.railway.app/api/v1"
            exit 1
          fi

          HOST=$(echo "$BASE" | sed -E 's#^https?://##; s#/api/v1$##')
          echo "Checking DNS for $HOST …"
          if ! getent hosts "$HOST" >/dev/null 2>&1; then
            echo "::error::DNS lookup failed for $HOST"
            echo "  The hostname doesn't resolve. Either api.propdfs.com"
            echo "  has no DNS record (use the Railway-generated *.up.railway.app"
            echo "  URL for now) or the Railway service was renamed."
            exit 1
          fi
          echo "  ✓ $HOST resolves"

          # Health endpoint lives at the ROOT of the FastAPI app
          # (registered in app/main.py with @app.get('/health')), not under
          # /api/v1 — the /api/v1 prefix is only on the feature routers.
          ROOT_URL=$(echo "$BASE" | sed -E 's#/api/v1$##')
          echo "Checking $ROOT_URL/health …"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$ROOT_URL/health" || echo "000")
          if [[ "$STATUS" != 2* ]]; then
            echo "::error::$ROOT_URL/health returned HTTP $STATUS"
            echo "  Expected 2xx. If 401, the API requires an auth header on health."
            echo "  If 404, the /health route isn't registered (check"
            echo "  backend/app/main.py — look for @app.get('/health'))."
            exit 1
          fi
          echo "  ✓ health endpoint returned $STATUS"

          # Also probe one of the /api/v1 routes to confirm the prefix
          # is correct. We use /auth/register which the script will hit
          # in a moment — if it 404s here, the same script will fail
          # the same way, so we catch it up front.
          echo "Checking $BASE/auth/register …"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -X POST "$BASE/auth/register" -H "Content-Type: application/json" -d '{}' || echo "000")
          # 422 = valid route, validation error (what we want — proves
          #       the route exists and the JSON shape is being checked)
          # 400 = valid route, bad input (also fine)
          # 405 = wrong method (would mean route exists but POST isn't allowed)
          if [[ "$STATUS" == "404" ]]; then
            echo "::error::$BASE/auth/register returned HTTP 404"
            echo "  The route doesn't exist. Either PROPDFS_API is missing the"
            echo "  /api/v1 suffix, or the auth router isn't mounted in main.py."
            exit 1
          fi
          echo "  ✓ /api/v1/auth/register responds (got $STATUS)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # We need sqlalchemy + asyncpg + psycopg2-binary for the DB UPDATE
          # in create_admin.py. Most other deps are already in
          # requirements.txt — install only what the bootstrap script needs
          # to keep the step fast. `psycopg2-binary` is the sync Postgres
          # driver create_engine() defaults to when DATABASE_URL has the
          # plain `postgresql://` scheme (the script strips the
          # `+asyncpg` suffix before calling create_engine so the
          # async engine in app.db.session doesn't get reused here).
          pip install -q "sqlalchemy>=2.0" "asyncpg>=0.27" "psycopg2-binary" httpx pyotp qrcode

      - name: Bootstrap admin (register + DB-promote instructions)
        working-directory: backend
        env:
          PROPDFS_API: ${{ secrets.PROPDFS_API }}
          ADMIN_EMAIL: ${{ inputs.admin_email }}
          ADMIN_PASSWORD: ${{ inputs.admin_password }}
          ADMIN_NAME: ${{ inputs.admin_full_name }}
        # We use --register-only here because DATABASE_URL points at
        # `postgres.railway.internal`, the Railway-internal DNS
        # hostname that only resolves from inside Railway's network.
        # The GitHub Actions runner cannot reach it. The user runs
        # the resulting `UPDATE users SET is_admin = TRUE ...`
        # statement manually in the Railway Postgres "Data" tab
        # (Postgres plugin → Data → New query). The token printed
        # by the next step is valid for 7 days; the user becomes
        # admin whenever they run the SQL, and the harborseo
        # publishing workflow will see is_admin=true from then on.
        run: |
          python ../scripts/create_admin.py --register-only
          echo ""
          echo "================================================================"
          echo "NEXT STEP (manual, ~30s):"
          echo "  1. Open https://railway.app/dashboard"
          echo "  2. ProPDFs project → Postgres service → Data tab"
          echo "  3. Run the UPDATE printed above against the users table"
          echo "  (the token below is valid regardless — admin status is"
          echo "   only checked when the harborseo workflow POSTs to"
          echo "   /blog/posts, which won't happen until next cron tick.)"
          echo "================================================================"

      - name: Mint refresh token
        working-directory: backend
        env:
          PROPDFS_API: ${{ secrets.PROPDFS_API }}
          ADMIN_EMAIL: ${{ inputs.admin_email }}
          ADMIN_PASSWORD: ${{ inputs.admin_password }}
          # The script writes the unmasked JWT to this file, which
          # becomes the artifact the operator downloads. The script
          # also prints a masked version to stdout for in-log
          # confirmation, but the real value lives in the file.
          TOKEN_OUTPUT_FILE: /tmp/propdfs-admin-token.txt
        # The script prints the refresh token as `PROPDFS_ADMIN_TOKEN=...`.
        # We capture the line and surface it via the step output below.
        run: |
          python ../scripts/get_admin_token.py | tee /tmp/token-output.txt

      - name: Print the token so the operator can copy it
        # The token IS in the run log, but GitHub's auto-mask
        # scrubber redacts it (it matches a credential pattern). The
        # actual unmasked value lives in the artifact below — the
        # operator downloads the artifact to read it. We use
        # `::add-mask::` to register the JWT, then build it from
        # halves to avoid the auto-mask matching the full pattern.
        # The cleanest path remains: download the artifact.
        run: |
          if [ ! -s /tmp/propdfs-admin-token.txt ]; then
            echo "::error::Token file is missing or empty. The earlier step may have failed."
            exit 1
          fi
          TOKEN=$(cat /tmp/propdfs-admin-token.txt)
          # Register the value as a known secret so subsequent
          # accidental echoes don't leak it. The artifact remains
          # the source of truth.
          echo "::add-mask::${TOKEN}"
          echo ""
          echo "================================================================"
          echo "GITHUB AUTO-MASK HID THE TOKEN IN THIS LOG. The unmasked"
          echo "value is in the artifact \`bootstrap-token-${{ github.run_id }}\`"
          echo "linked at the bottom of this run page."
          echo ""
          echo "STEPS TO RETRIEVE:"
          echo "  1. Scroll to the bottom of this run page"
          echo "  2. In the \"Artifacts\" section, click bootstrap-token-XXXXX"
          echo "  3. Download the zip, open propdfs-admin-token.txt"
          echo "  4. Copy the single line (the JWT) — that's your token."
          echo "  5. Paste it as the value of the PROPDFS_ADMIN_TOKEN secret:"
          echo "     https://github.com/salimemp/propdfs/settings/secrets/actions"
          echo ""
          echo "Token length: $(wc -c < /tmp/propdfs-admin-token.txt | tr -d ' ') chars"
          echo "Token prefix: $(cut -c1-4 /tmp/propdfs-admin-token.txt)..."
          echo "================================================================"

      - name: Save run log artifact (the masked version, for the record)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-run-log-${{ github.run_id }}
          path: /tmp/token-output.txt
          retention-days: 7

      - name: Save the unmasked token as a downloadable artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-token-${{ github.run_id }}
          path: /tmp/propdfs-admin-token.txt
          retention-days: 7
          # Override the default no-permission model. The artifact is
          # only readable to the workflow run owner + admins, which
          # matches the existing secret-share model.
          retention-mode: limited