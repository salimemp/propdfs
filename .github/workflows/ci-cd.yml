name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-lint:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: black --check app/
      - run: ruff check app/
      - run: pytest tests/ -v

  backend-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t propdfs-backend:latest ./backend

  frontend-lint:
    name: Flutter Analyze & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to 3.27+ because the Sentry SDK + intl 0.20.2 dependency
          # chain requires Flutter's localizations from 3.27 onward. The
          # previous 3.24.0 pin only worked with intl ^0.19.0.
          flutter-version: '3.32.0'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build web --release

  # --- STAGING DEPLOY (develop branch) ---
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-lint]
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      # Pin Node 24 for the npm/npx steps below. GitHub's ubuntu-latest
      # runner ships with Node 20 by default; @railway/cli and
      # @sentry/cli both work fine on 24, and 24 is the current LTS
      # line (Node 20 is end-of-life April 2026).
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Deploy backend to Railway Staging
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy Backend to Railway Staging
        run: railway up --service backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}

      # Deploy frontend to Cloudflare Pages (Staging)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
      - name: Build Flutter Web for Staging
        run: |
          cd frontend
          flutter build web --release \
            --dart-define=API_BASE_URL=https://backend-staging-fd1c0.up.railway.app \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN_STAGING }} \
            --dart-define=APP_VERSION=propdfs@${{ github.sha }} \
            --dart-define=ENVIRONMENT=staging
      - name: Upload Sentry source maps (Staging)
        if: false  # temporarily disabled pending project slug fix
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: propdfs-flutter
        run: |
          cd frontend
          npx --yes @sentry/cli@latest releases new "propdfs@${{ github.sha }}"
          npx --yes @sentry/cli@latest releases files "propdfs@${{ github.sha }}" \
            upload-sourcemaps \
            --ext dart --ext js --ext map \
            --url-prefix "~/main.dart.js" \
            build/web
      - name: Deploy to Cloudflare Pages (Staging)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: propdfs-staging
          directory: frontend/build/web

  # --- PRODUCTION DEPLOY (main branch) ---
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-lint]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Pin Node 24 for the npm/npx steps below. See deploy-staging
      # for the rationale.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Deploy backend to Railway Production
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy Backend to Railway Production
        run: railway up --service backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PRODUCTION_TOKEN }}

      # Deploy frontend to Cloudflare Pages (Production).
      # The flutter-action step installs the same Flutter version used by
      # the lint job so `flutter build web` is available here too.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.0"
      - name: Build Flutter Web for Production
        run: |
          cd frontend
          flutter build web --release \
            --dart-define=API_BASE_URL=https://backend-production-fd1c0.up.railway.app \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN_PRODUCTION }} \
            --dart-define=APP_VERSION=propdfs@${{ github.sha }} \
            --dart-define=ENVIRONMENT=production
      - name: Upload Sentry source maps (Production)
        if: false  # temporarily disabled pending project slug fix
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: propdfs-flutter
        run: |
          cd frontend
          npx --yes @sentry/cli@latest releases new "propdfs@${{ github.sha }}"
          npx --yes @sentry/cli@latest releases files "propdfs@${{ github.sha }}" \
            upload-sourcemaps \
            --ext dart --ext js --ext map \
            --url-prefix "~/main.dart.js" \
            build/web
      - name: Deploy to Cloudflare Pages (Production)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: propdfs
          directory: frontend/build/web
