name: SEO audit + auto-publish

# Runs the harborseo.ai integration on a schedule and on demand.
#
# Two jobs:
#   - audit: posts an artifact with findings (no PR opened yet — the
#     safe fixes ship via PR if --apply is set; otherwise the run is
#     informative only).
#   - blog:  picks up `scripts/_seeds/topics.json` and generates + POSTs
#     one article per topic. Topics are gated on a manual dispatch so
#     we don't accidentally spam the live blog.
#
# Secrets required:
#   - HARBORSEO_API_KEY         — harborseo.ai API key (ask the user)
#   - PROPDFS_API               — base URL of the backend, defaults to
#                                 https://api.propdfs.com
#   - PROPDFS_ADMIN_TOKEN       — long-lived bearer token for an admin
#                                 user (used to POST to /blog/posts)

on:
  schedule:
    # Run the audit weekly on Monday at 09:00 UTC. The auto-blog job
    # is `workflow_dispatch` only — we don't want a cron to silently
    # publish posts.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish generated blog posts to /blog/posts"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install httpx
      - name: Audit propdfs.com
        env:
          HARBORSEO_API_KEY: ${{ secrets.HARBORSEO_API_KEY }}
        run: |
          python scripts/harborseo.py audit \
            --domain propdfs.com \
            --domain app.getpdfpro.com \
            --json > audit-report.json
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-${{ github.run_id }}
          path: audit-report.json
          retention-days: 90

  blog:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install httpx
      - name: Generate and publish blog post
        env:
          HARBORSEO_API_KEY: ${{ secrets.HARBORSEO_API_KEY }}
          PROPDFS_API: ${{ secrets.PROPDFS_API || 'https://api.propdfs.com/api/v1' }}
          PROPDFS_ADMIN_TOKEN: ${{ secrets.PROPDFS_ADMIN_TOKEN }}
        run: |
          # Reads topics from scripts/_seeds/topics.json and publishes
          # each in turn. The seed file is committed to the repo so the
          # queue is reproducible — remove a topic by deleting its line.
          python -m pip install -q httpx
          python scripts/publish_queued_posts.py
