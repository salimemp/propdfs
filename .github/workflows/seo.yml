name: SEO audit + auto-publish

# Runs the harborseo.ai integration on a schedule and on demand.
#
# Two jobs:
#   - audit: runs `harborseo.py audit --domain propdfs.com` (sites +
#     article health), uploads the result as a workflow artifact.
#     No PR is opened automatically — the operator reviews the
#     artifact and applies any safe fixes via a follow-up PR.
#   - blog:  picks up `scripts/_seeds/topics.json` and POSTs each
#     one to the backend's /blog/posts endpoint. Gated on manual
#     dispatch + `publish=true` so we don't accidentally spam
#     the live blog.
#
# Secrets required:
#   - HARBORSEO_API_KEY         — harborseo.ai API key (create at
#                                 https://harborseo.ai/dashboard)
#   - PROPDFS_API               — base URL of the ProPDFs backend
#                                 (e.g. https://backend-production-fd1c0
#                                 .up.railway.app/api/v1)
#   - PROPDFS_ADMIN_TOKEN       — long-lived bearer refresh token
#                                 (mint via the admin-bootstrap
#                                 workflow)

on:
  schedule:
    # Run the audit weekly on Monday at 09:00 UTC. The auto-blog
    # job is `workflow_dispatch` only — we don't want a cron to
    # silently publish posts.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish generated blog posts to /blog/posts"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      limit:
        description: "Max topics to publish this run (default: 5; free plan needs ~4-5 min per article)"
        required: false
        default: "5"
        type: string
      offset:
        description: "Skip the first N topics in the queue (use after a partial run to continue)"
        required: false
        default: "0"
        type: string

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install httpx
      - name: Audit propdfs.com
        env:
          HARBORSEO_API_KEY: ${{ secrets.HARBORSEO_API_KEY }}
        # Run audit, tee to the artifact file. Non-zero exit (e.g.
        # harborseo 5xx) does NOT fail the workflow — the audit
        # job is informational, we want to see the failure in the
        # log even if no findings were produced.
        run: |
          set +e
          python scripts/harborseo.py audit --domain propdfs.com \
            | tee audit-report.txt
          echo "exit=$?" >> audit-report.txt
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-audit-${{ github.run_id }}
          path: audit-report.txt
          retention-days: 90

  blog:
    if: github.event_name == 'workflow_dispatch' && inputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install httpx html2text
      - name: Generate and publish blog posts
        env:
          HARBORSEO_API_KEY: ${{ secrets.HARBORSEO_API_KEY }}
          PROPDFS_API: ${{ secrets.PROPDFS_API || 'https://api.propdfs.com/api/v1' }}
          PROPDFS_ADMIN_TOKEN: ${{ secrets.PROPDFS_ADMIN_TOKEN }}
        # Reads topics from scripts/_seeds/topics.json, generates
        # each via harborseo (or local fallback if no key), and
        # POSTs to the backend. Idempotent — already-published
        # slugs are skipped. Per-topic error handling: one
        # failure doesn't abort the batch. --limit/--offset
        # come from the workflow_dispatch inputs so the operator
        # can throttle to ~3 topics per day on the free plan.
        run: |
          python scripts/publish_queued_posts.py \
            --limit "${{ inputs.limit }}" \
            --offset "${{ inputs.offset }}"
