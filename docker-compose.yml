version: "3.8"

services:
  api:
    build: ./backend
    container_name: propdfs-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/propdfs
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=dev-secret-key-change-in-production
      - DEBUG=true
      - ENVIRONMENT=development
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./backend/app:/app/app
    depends_on:
      - db
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    container_name: propdfs-worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/propdfs
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=dev-secret-key-change-in-production
      - DEBUG=true
      - ENVIRONMENT=development
    volumes:
      - ./backend/app:/app/app
    depends_on:
      - db
      - redis
    command: celery -A app.services.celery_tasks.celery_app worker --loglevel=info --concurrency=2

  db:
    image: postgres:16-alpine
    container_name: propdfs-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=propdfs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: propdfs-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
